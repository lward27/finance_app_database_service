api_version: pharness.dev/v1alpha1
environment_profile: python-3.11
dependency_lock:
  kind: pip_requirements
  path: requirements-dev.lock
  sha256: 76d0e350a09d57b732b120eac194392a8b016e1156101ed52f91b15ecb2946cf
writable_paths:
- src/**
- tests/**
- README.md
acceptance_commands:
- name: unit-tests
  command: python -m unittest discover -s tests -v
- name: compileall
  command: python -m compileall -q src tests
roots:
  source:
  - src
  tests:
  - tests
  documentation:
  - README.md
agent_network: denied
package_installation: preparation_only
